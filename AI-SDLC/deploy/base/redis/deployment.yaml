apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: state
    app.kubernetes.io/part-of: ai-sdlc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: state
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          # No PVC by design: checkpoints, rate-limit counters and cache.
          # Losing them degrades a run, it does not lose committed work.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
