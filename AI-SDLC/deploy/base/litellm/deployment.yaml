apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ai-sdlc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: gateway
      annotations:
        # Roll the pods when the routing config changes; without this a
        # ConfigMap edit is silently ignored until something else restarts
        # the Deployment, which makes "swap the model" look broken on stage.
        checksum/config: replaced-by-kustomize-configmap-hash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.61.20
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-secrets, key: master-key }
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef: { name: litellm-secrets, key: salt-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: litellm-secrets, key: database-url }
            # Where the provider actually lives. Host-mapped by default: the
            # Ollama gateway proxies :cloud models upstream, so the cluster
            # needs no GPU and the egress story stays a single hop.
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef: { name: litellm-env, key: ollama-base-url }
            - name: STORE_MODEL_IN_DB
              value: "True"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # Startup is separate from liveness on purpose: the gateway runs
          # database migrations on first boot, which comfortably exceeds a
          # liveness window and would otherwise CrashLoop on a clean cluster.
          startupProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: litellm-config
