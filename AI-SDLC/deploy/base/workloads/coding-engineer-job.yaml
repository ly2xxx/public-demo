# A run is a Job, not a request to a long-lived service.
#
# One Job == one worktree == one budget == one audit record. Kubernetes then
# owns the things that are otherwise the agent's job to enforce on itself:
# activeDeadlineSeconds is the wall-clock budget, backoffLimit is the retry
# ceiling, and the pod's resource limits are the blast radius. An agent
# cannot talk its way past a kubelet.
#
# Templated: scripts/run.sh substitutes RUN_ID and GOAL and applies a copy.
apiVersion: batch/v1
kind: Job
metadata:
  name: coding-engineer-RUN_ID
  namespace: ai-sdlc
  labels:
    app.kubernetes.io/name: coding-engineer
    app.kubernetes.io/component: maker
    app.kubernetes.io/part-of: ai-sdlc
    ai-sdlc.run/id: "RUN_ID"
spec:
  backoffLimit: 0            # a failed run escalates; it does not silently retry
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coding-engineer
        app.kubernetes.io/component: maker
        ai-sdlc.run/id: "RUN_ID"
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coding-engineer
          image: localhost/ai-sdlc/coding-engineer:GIT_SHA
          imagePullPolicy: IfNotPresent
          args: ["--run-id", "RUN_ID", "--goal-file", "/etc/run/goal.md"]
          env:
            # The agent never sees a provider key — only a scoped virtual key
            # for its team, with that team's budget attached.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-virtual-keys, key: platform-eng }
            - name: OPENAI_BASE_URL
              value: http://litellm.ai-platform.svc.cluster.local:4000/v1
            - name: MAKER_MODEL
              value: maker
            - name: CHECKER_MODEL
              value: checker
            - name: REDIS_URL
              value: redis://redis.ai-platform.svc.cluster.local:6379
          volumeMounts:
            - name: goal
              mountPath: /etc/run
              readOnly: true
            - name: worktree
              mountPath: /work
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: goal
          configMap:
            name: run-RUN_ID
        - name: worktree
          emptyDir:
            sizeLimit: 2Gi
