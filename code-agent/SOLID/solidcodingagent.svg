<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-label="Module map of coding_agent: nodes.py holding ten node functions, engine.py holding build_graph and a compatibility shim, state.CodingLoopState shared by every node, and the boundary modules gates, code_exec, worktree, llm_boundaries and maker_tools. Badges mark which SOLID principle each relationship satisfies or breaks.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1120" height="700" fill="#ffffff"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="38" font-size="18" font-weight="700" fill="#1f2933">SOLID, located in coding_agent/</text>
    <text x="40" y="60" font-size="12.5" fill="#6b7684">One harness, ten nodes, one state dict. Nothing is shared between runs — so every principle here is a claim about an arrow inside a single run.</text>

    <!-- nodes.py -->
    <rect x="40" y="88" width="400" height="250" rx="10" fill="#fbfbfc" stroke="#1f2933"/>
    <text x="56" y="114" font-size="13.5" font-weight="700" fill="#1f2933">nodes.py</text>
    <text x="56" y="131" font-size="10" fill="#6b7684">10 node functions + 6 routers · 832 lines</text>
    <circle cx="416" cy="110" r="11" fill="#157a6e"/><text x="416" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>

    <g font-size="11" fill="#1f2933">
      <rect x="54" y="146" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="144" y="164" text-anchor="middle">intake_node</text>
      <rect x="54" y="180" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="144" y="198" text-anchor="middle">author_bdd_node</text>
      <rect x="54" y="214" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="144" y="232" text-anchor="middle">plan_tot_node</text>
      <rect x="54" y="248" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="144" y="266" text-anchor="middle">code_node</text>
      <rect x="54" y="282" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="144" y="300" text-anchor="middle">self_check_node</text>

      <rect x="246" y="146" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="336" y="164" text-anchor="middle">bdd_gate_node</text>
      <rect x="246" y="180" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="336" y="198" text-anchor="middle">review_node</text>
      <rect x="246" y="214" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="336" y="232" text-anchor="middle">diagnose_node</text>
      <rect x="246" y="248" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="336" y="266" text-anchor="middle">finalize_node</text>
      <rect x="246" y="282" width="180" height="28" rx="6" fill="#ffffff" stroke="#9aa3ad"/><text x="336" y="300" text-anchor="middle">escalate_node</text>
    </g>

    <!-- engine.py -->
    <rect x="560" y="88" width="320" height="110" rx="10" fill="#fbfbfc" stroke="#1f2933"/>
    <text x="576" y="114" font-size="13.5" font-weight="700" fill="#1f2933">engine.py</text>
    <text x="576" y="136" font-size="10.5" fill="#1f2933">build_graph() — 10 × add_node, 6 × conditional edges</text>
    <text x="576" y="154" font-size="10.5" fill="#6b7684">compat re-export shim: get_llm, _llm_*, _run_maker</text>
    <text x="576" y="176" font-size="10.5" fill="#b8860b">a new node lands in all three: here, nodes.py, state</text>
    <circle cx="856" cy="110" r="11" fill="#b8860b"/><text x="856" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>

    <!-- engine <-> nodes -->
    <line x1="556" y1="118" x2="446" y2="118" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="500" y="110" font-size="9.5" fill="#6b7684" text-anchor="middle">imports at load</text>
    <line x1="444" y1="152" x2="556" y2="152" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="500" y="170" font-size="9.5" fill="#c0392b" text-anchor="middle">_eng() at call time</text>

    <!-- state -->
    <rect x="560" y="232" width="320" height="106" rx="10" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/>
    <text x="576" y="258" font-size="13.5" font-weight="700" fill="#1f2933">state.CodingLoopState</text>
    <text x="576" y="278" font-size="10.5" fill="#1f2933">one TypedDict · 30 fields · the only shared surface</text>
    <text x="576" y="296" font-size="10.5" fill="#1f2933">every node: (CodingLoopState) -&gt; dict</text>
    <text x="576" y="314" font-size="10.5" fill="#c0392b">no node declares which four fields it reads</text>
    <circle cx="856" cy="258" r="11" fill="#157a6e"/><text x="856" y="262" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
    <circle cx="856" cy="288" r="11" fill="#c0392b"/><text x="856" y="292" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">I</text>

    <line x1="444" y1="285" x2="556" y2="285" stroke="#1f2933" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="500" y="277" font-size="9.5" fill="#6b7684" text-anchor="middle">reads / writes</text>

    <!-- engine -> llm_boundaries, routed round the right margin -->
    <path d="M 880 150 L 1000 150 L 1000 378 L 772 378 L 772 396" fill="none" stroke="#1f2933" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="1008" y="266" font-size="9.5" fill="#6b7684">get_llm, _llm_*</text>

    <!-- nodes -> shared modules -->
    <g stroke="#6b7684" stroke-width="1.1" fill="none" marker-end="url(#am)">
      <path d="M 130 338 L 130 396"/>
      <path d="M 240 338 L 330 396"/>
      <path d="M 350 338 L 540 396"/>
    </g>
    <text x="150" y="368" font-size="9.5" fill="#6b7684">imports</text>

    <!-- shared modules -->
    <g>
      <rect x="40" y="400" width="200" height="84" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
      <text x="56" y="424" font-size="12" font-weight="700" fill="#1f2933">gates.py</text>
      <text x="56" y="443" font-size="10" fill="#6b7684">differential ruff</text>
      <text x="56" y="459" font-size="10" fill="#6b7684">pytest · frozen BDD suite</text>

      <rect x="250" y="400" width="200" height="84" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
      <text x="266" y="424" font-size="12" font-weight="700" fill="#1f2933">tools/code_exec.py</text>
      <text x="266" y="443" font-size="10" fill="#6b7684">Jail · run_command</text>
      <text x="266" y="459" font-size="10" fill="#6b7684">the sandbox boundary</text>

      <rect x="460" y="400" width="200" height="84" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
      <text x="476" y="424" font-size="12" font-weight="700" fill="#1f2933">tools/worktree.py</text>
      <text x="476" y="443" font-size="10" fill="#6b7684">WorktreeHandle</text>
      <text x="476" y="459" font-size="10" fill="#6b7684">diff · commit · baseline</text>

      <rect x="670" y="400" width="200" height="84" rx="9" fill="#ffffff" stroke="#157a6e" stroke-width="1.5"/>
      <text x="686" y="424" font-size="12" font-weight="700" fill="#157a6e">llm_boundaries.py</text>
      <text x="686" y="443" font-size="10" fill="#157a6e">_llm_author_bdd · _llm_review</text>
      <text x="686" y="459" font-size="10" fill="#157a6e">every model call, one place</text>
      <circle cx="846" cy="422" r="11" fill="#c0392b"/><text x="846" y="426" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>

      <rect x="880" y="400" width="200" height="84" rx="9" fill="#ffffff" stroke="#157a6e" stroke-width="1.5"/>
      <text x="896" y="424" font-size="12" font-weight="700" fill="#157a6e">maker_tools.py</text>
      <text x="896" y="443" font-size="10" fill="#157a6e">6 × @tool, built per run</text>
      <text x="896" y="459" font-size="10" fill="#157a6e">add one, edit nothing else</text>
      <circle cx="1056" cy="422" r="11" fill="#157a6e"/><text x="1056" y="426" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>
    </g>
    <line x1="872" y1="442" x2="878" y2="442" stroke="#157a6e" stroke-width="1.2"/>

    <!-- legend -->
    <line x1="40" y1="512" x2="1080" y2="512" stroke="#dde1e6"/>
    <g font-size="10" font-weight="700" fill="#9aa3ad" letter-spacing="1.2">
      <text x="40" y="536">READING THE PRINCIPLES OFF THE MODULE GRAPH</text>
    </g>
    <g font-size="10.5" fill="#6b7684">
      <circle cx="700" cy="532" r="5" fill="#157a6e"/><text x="712" y="536">holds</text>
      <circle cx="770" cy="532" r="5" fill="#b8860b"/><text x="782" y="536">partial</text>
      <circle cx="850" cy="532" r="5" fill="#c0392b"/><text x="862" y="536">does not hold</text>
    </g>

    <g font-size="11.5" fill="#1f2933">
      <circle cx="49" cy="561" r="9" fill="#157a6e"/><text x="49" y="565" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
      <text x="68" y="565">engine.py is already split into state / nodes / gates / maker_tools / llm_boundaries — its own docstring calls it the single-responsibility refactor.</text>

      <circle cx="49" cy="589" r="9" fill="#b8860b"/><text x="49" y="593" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>
      <text x="68" y="593">A new maker tool touches maker_tools.py and nothing else. A new node touches build_graph, nodes.py and the state dict — three edits for one idea.</text>

      <circle cx="49" cy="617" r="9" fill="#157a6e"/><text x="49" y="621" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
      <text x="68" y="621">Every node is (CodingLoopState) -&gt; dict and every router (CodingLoopState) -&gt; str, so the graph can reroute without any node knowing.</text>

      <circle cx="49" cy="645" r="9" fill="#c0392b"/><text x="49" y="649" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">I</text>
      <text x="68" y="649">Every node receives all 30 state fields; none declares the handful it reads. Add a field for one node and the blast radius is the whole graph.</text>

      <circle cx="49" cy="673" r="9" fill="#c0392b"/><text x="49" y="677" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
      <text x="68" y="677">LLM calls do funnel through llm_boundaries — but nodes reach them via _eng(), a lazy import of the concrete engine module, kept for monkeypatching.</text>
    </g>
  </g>
</svg>
